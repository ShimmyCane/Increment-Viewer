<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Increment Viewer: progress</title>
<style>
  :root {
    --ink: #2d2a32; --paper: #f7f1e6; --card: #fffdf8; --sun: #ffe08a; --mint: #c9ecdc; --shadow: 0 4px 0 #2d2a32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f3eee6; --paper: #24212a; --card: #2f2b36; --sun: #6b5a2a; --mint: #2e4a40; --shadow: 0 4px 0 #0d0b10; }
  }
  :root[data-theme="dark"] { --ink: #f3eee6; --paper: #24212a; --card: #2f2b36; --sun: #6b5a2a; --mint: #2e4a40; --shadow: 0 4px 0 #0d0b10; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
  header { padding: 16px; background: var(--sun); border-bottom: 3px solid var(--ink); }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 6px 0 0; }
  main { padding: 16px; display: grid; gap: 14px; max-width: 980px; margin: 0 auto; }
  .card {
    display: grid; gap: 6px; background: var(--card); color: var(--ink); text-decoration: none;
    border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px;
  }
  .card:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .card .name { font-weight: bold; font-size: 1.05rem; }
  .card .meta { font-size: 0.92rem; }
  .card .db { font-size: 0.85rem; opacity: 0.8; }
  .none { font-style: italic; opacity: 0.8; }
</style>
</head>
<body>
<header>
  <h1>Increment Viewer: progress</h1>
  <p id="intro">Loading the list of reviews…</p>
</header>
<main id="list" aria-live="polite"></main>

<script src="viewer_db.js"></script>
<script>
(function () {
  // Portfolio: one card per review in the Architecture and Family databases (viewer_db.js).
  // Rejected reviews are left out, the same as in the viewer.
  var list = document.getElementById('list');
  var intro = document.getElementById('intro');

  function setText(node, text) { node.textContent = text; }

  function card(set, count) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = 'viewer.html?set=' + encodeURIComponent(set.id);

    var name = document.createElement('div');
    name.className = 'name';
    setText(name, set.label || set.title || set.id);
    a.appendChild(name);

    var meta = document.createElement('div');
    meta.className = 'meta';
    setText(meta, count + (count === 1 ? ' step' : ' steps'));
    a.appendChild(meta);

    var db = document.createElement('div');
    db.className = 'db';
    setText(db, 'From the ' + set.db.name + ' database');
    a.appendChild(db);
    return a;
  }

  Promise.all([window.ViewerDB.loadSets(), window.ViewerDB.countScenes()]).then(function (res) {
    var found = res[0];
    var counts = res[1];
    setText(intro, found.sets.length + ' reviews. Pick one to open it in the viewer.');
    found.errors.forEach(function (msg) {
      var p = document.createElement('div');
      p.className = 'none';
      setText(p, 'Could not read a database: ' + msg);
      list.appendChild(p);
    });
    found.sets.forEach(function (set) { list.appendChild(card(set, counts[set.id] || 0)); });
    if (!found.sets.length && !found.errors.length) setText(intro, 'No reviews to show.');
  }).catch(function (err) {
    setText(intro, 'The list of reviews could not be loaded. ' + err.message);
  });
})();
</script>
</body>
</html>
