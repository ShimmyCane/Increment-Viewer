<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Increment Viewer</title>
<style>
  :root {
    --ink: #2d2a32;
    --paper: #f7f1e6;
    --card: #fffdf8;
    --sun: #ffe08a;
    --mint: #c9ecdc;
    --sky: #cfe4f7;
    --shadow: 0 4px 0 #2d2a32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f3eee6; --paper: #24212a; --card: #2f2b36; --sun: #6b5a2a; --mint: #2e4a40; --sky: #2c3f57; --shadow: 0 4px 0 #0d0b10; }
  }
  :root[data-theme="dark"] { --ink: #f3eee6; --paper: #24212a; --card: #2f2b36; --sun: #6b5a2a; --mint: #2e4a40; --sky: #2c3f57; --shadow: 0 4px 0 #0d0b10; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
  body { min-height: 100vh; }

  header { position: relative; padding: 14px 170px 14px 16px; background: var(--sun); border-bottom: 3px solid var(--ink); }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; font-size: 0.95rem; }
  .delete-scene { position: absolute; top: 12px; right: 16px; min-height: 44px; padding: 0 14px; background: var(--card); }
  .delete-scene:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .notice { margin: 6px 0 0; font-weight: bold; }
  .notice[hidden] { display: none; }
  .picker { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: bold; flex-wrap: wrap; }
  .picker select {
    font: inherit; color: var(--ink); background: var(--card);
    border: 3px solid var(--ink); border-radius: 14px;
    min-height: 48px; padding: 0 12px; max-width: 100%; box-shadow: var(--shadow);
  }
  .picker select[hidden] { display: none; }

  dialog {
    width: min(92vw, 440px); padding: 18px; color: var(--ink); background: var(--card);
    border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(20, 18, 24, 0.5); }
  dialog h2 { margin: 0 0 8px; font-size: 1.2rem; }
  dialog p { margin: 0 0 12px; }
  .mute { display: flex; align-items: center; gap: 10px; font-weight: bold; min-height: 44px; margin-bottom: 12px; }
  .mute input { width: 22px; height: 22px; margin: 0; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .dialog-actions .danger { background: #f4b6b6; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 86px);
    min-height: 520px;
  }

  /* Slideshow: every view is stacked in the same box; only one is shown */
  .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .frames {
    position: relative;
    flex: 1;
    min-height: 260px;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .frame {
    position: absolute; inset: 0; margin: 0;
    opacity: 0; transition: opacity 0.6s ease;
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
  .frame.on { opacity: 1; }
  .frame img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  .frame .missing { font-weight: bold; color: #a33; }

  .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .caption strong { font-size: 1.15rem; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--ink); background: var(--mint);
    border: 3px solid var(--ink); border-radius: 14px;
    min-height: 52px; min-width: 52px; padding: 0 18px;
    box-shadow: var(--shadow); cursor: pointer;
  }
  button:active { transform: translateY(3px); box-shadow: none; }
  button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }

  .dots { display: flex; gap: 8px; flex-wrap: wrap; }
  .dot {
    width: 36px; height: 36px; min-width: 36px; min-height: 36px; padding: 0; border-radius: 50%;
    font-size: 0.8rem; font-weight: bold; background: var(--card);
  }
  .dot.on { background: var(--sun); }

  /* State card: a step that has no picture shows its numbers as bars */
  .card { width: 100%; height: 100%; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .card .kicker { font-weight: bold; font-size: 1.2rem; }
  .card .bar { display: grid; grid-template-columns: minmax(110px, 1.2fr) 3fr minmax(3ch, auto); gap: 10px; align-items: center; }
  .card .track { height: 24px; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper); overflow: hidden; }
  .card .fill { height: 100%; background: var(--c, var(--mint)); border-right: 3px solid var(--ink); }
  .card .val { font-weight: bold; text-align: right; }
  .card .note { margin: 0; font-style: italic; }
  .frame .none { opacity: 0.7; }

  /* Side panel: running log, scrolls on its own */
  .log {
    position: relative;
    overflow-y: auto;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 12px;
  }
  .log h2 { margin: 4px 4px 10px; font-size: 1.1rem; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .entry {
    display: block; width: 100%; text-align: left;
    background: var(--paper); border-radius: 12px;
    min-height: 0; padding: 10px 12px; box-shadow: none;
  }
  .entry.on { background: var(--sun); }
  .entry .head { font-weight: bold; }
  .entry .desc { margin: 6px 0 0; font-size: 0.92rem; }
  .entry ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.88rem; }
  .entry h3 { margin: 8px 0 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Phone and narrow tablet: stack the panel under the slideshow */
  @media (max-width: 820px) {
    header { padding-right: 16px; padding-top: 58px; }
    .delete-scene { top: 10px; right: 12px; }
    .layout { grid-template-columns: 1fr; height: auto; min-height: 0; padding: 12px; }
    .frames { flex: none; height: 56vh; min-height: 280px; }
    .log { max-height: 60vh; }
  }
</style>
</head>
<body>
<header>
  <button type="button" id="delete-scene" class="delete-scene" disabled>Delete scene</button>
  <h1 id="title">Increment Viewer</h1>
  <p id="subtitle">Loading…</p>
  <p id="notice" class="notice" hidden></p>
  <label class="picker">Scene
    <select id="picker" aria-label="Choose a scene" hidden></select>
  </label>
</header>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">Delete this scene?</h2>
  <p id="delete-text"></p>
  <label class="mute"><input type="checkbox" id="delete-mute"> Don't warn me again for 2 minutes</label>
  <div class="dialog-actions">
    <button type="button" id="delete-cancel">Cancel</button>
    <button type="button" id="delete-confirm" class="danger">Delete scene</button>
  </div>
</dialog>

<main class="layout">
  <section class="stage" aria-label="Slideshow">
    <div class="frames" id="frames" aria-live="polite"></div>
    <div class="caption">
      <strong id="cap-title"></strong>
      <span id="cap-count"></span>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous view">◀ Back</button>
      <button id="play" aria-label="Pause or play">⏸ Pause</button>
      <button id="next" aria-label="Next view">Next ▶</button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <aside class="log" aria-label="Running log">
    <h2>Running log</h2>
    <ol id="log"></ol>
  </aside>
</main>

<script src="viewer_db.js"></script>
<script>
(function () {
  // The reviews come from the Supabase databases (viewer_db.js). ?set=<id> opens one review; ?step=<n> opens on step n.
  // Deleting a review flags it as rejected in its database and hides it from this page.
  var params = new URLSearchParams(location.search);
  var requestedSet = params.get('set');
  var stepParam = parseInt(params.get('step'), 10);
  var INTERVAL_MS = 4000;
  var NOTICE_KEY = 'incrementViewer.notice';
  var MUTE_KEY = 'incrementViewer.muteDeleteWarningUntil';
  var MUTE_MS = 2 * 60 * 1000;

  var el = function (id) { return document.getElementById(id); };
  var state = { index: 0, timer: null, playing: true, items: [] };
  var sets = [];        // the reviews that are not rejected
  var current = null;   // the review on screen

  function setText(node, text) { node.textContent = text; }

  function showNotice(text) {
    var n = el('notice');
    if (text) { setText(n, text); n.hidden = false; } else { n.hidden = true; }
  }

  // ----- Slideshow -----

  function start(title, subtitle, items) {
    if (!items || items.length === 0) {
      setText(el('subtitle'), 'This review has no scenes in the database.');
      return;
    }
    state.items = items;
    setText(el('title'), title || 'Increment Viewer');
    setText(el('subtitle'), subtitle || '');
    document.title = title || 'Increment Viewer';

    buildFrames(items);
    buildDots(items);
    buildLog(items);

    el('prev').onclick = function () { go(state.index - 1); };
    el('next').onclick = function () { go(state.index + 1); };
    el('play').onclick = function () {
      state.playing = !state.playing;
      setText(el('play'), state.playing ? '⏸ Pause' : '▶ Play');
      if (state.playing) restartTimer(); else stopTimer();
    };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { go(state.index + 1); }
      if (e.key === 'ArrowLeft') { go(state.index - 1); }
    });

    var first = (stepParam >= 1 && stepParam <= items.length) ? stepParam - 1 : 0;
    if (stepParam >= 1) { state.playing = false; setText(el('play'), '▶ Play'); }
    show(first);
    restartTimer();
  }

  // Keep the address on the step you are looking at, so the link can be shared.
  function setStepUrl() {
    try {
      var u = new URL(location.href);
      u.searchParams.set('step', String(state.index + 1));
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) { /* blocked history: the viewer works, the link just stays as it was */ }
  }
  function go(i) { show(i); restartTimer(); setStepUrl(); }

  function safeColor(c) { return /^#[0-9a-f]{3,8}$/i.test(String(c || '')) ? c : null; }

  function buildCard(card) {
    var wrap = document.createElement('div');
    wrap.className = 'card';
    if (card.kicker) {
      var k = document.createElement('div');
      k.className = 'kicker';
      setText(k, card.kicker);
      wrap.appendChild(k);
    }
    (card.bars || []).forEach(function (b) {
      var row = document.createElement('div');
      row.className = 'bar';
      var lab = document.createElement('span');
      setText(lab, b.label);
      var track = document.createElement('div');
      track.className = 'track';
      var fill = document.createElement('div');
      fill.className = 'fill';
      var pct = b.max > 0 ? Math.max(0, Math.min(100, 100 * Number(b.value) / b.max)) : 0;
      fill.style.width = pct + '%';
      var col = safeColor(b.color);
      if (col) fill.style.setProperty('--c', col);
      track.appendChild(fill);
      var val = document.createElement('span');
      val.className = 'val';
      setText(val, String(b.value));
      row.appendChild(lab); row.appendChild(track); row.appendChild(val);
      wrap.appendChild(row);
    });
    if (card.note) {
      var n = document.createElement('p');
      n.className = 'note';
      setText(n, card.note);
      wrap.appendChild(n);
    }
    return wrap;
  }

  function buildFrames(items) {
    var box = el('frames');
    box.replaceChildren();
    items.forEach(function (item, i) {
      var fig = document.createElement('figure');
      fig.className = 'frame';
      if (item.image) {
        var img = document.createElement('img');
        img.alt = (item.id || ('View ' + (i + 1))) + ': ' + (item.title || '');
        img.src = item.image;
        img.onerror = function () {
          var p = document.createElement('p');
          p.className = 'missing';
          setText(p, 'Image not found: ' + item.image);
          fig.replaceChildren(p);
        };
        fig.appendChild(img);
      } else if (item.card) {
        fig.appendChild(buildCard(item.card));
      } else {
        var none = document.createElement('p');
        none.className = 'none';
        setText(none, 'No picture for this step.');
        fig.appendChild(none);
      }
      box.appendChild(fig);
    });
  }

  function buildDots(items) {
    var row = el('dots');
    row.replaceChildren();
    items.forEach(function (item, i) {
      var b = document.createElement('button');
      b.className = 'dot';
      setText(b, String(i + 1));
      b.setAttribute('aria-label', 'Show ' + (item.id || ('view ' + (i + 1))));
      b.onclick = function () { go(i); };
      row.appendChild(b);
    });
  }

  function listBlock(heading, lines) {
    if (!lines || lines.length === 0) return null;
    var wrap = document.createDocumentFragment();
    var h = document.createElement('h3');
    setText(h, heading);
    var ul = document.createElement('ul');
    lines.forEach(function (line) {
      var li = document.createElement('li');
      setText(li, line);
      ul.appendChild(li);
    });
    wrap.appendChild(h);
    wrap.appendChild(ul);
    return wrap;
  }

  function buildLog(items) {
    var list = el('log');
    list.replaceChildren();
    items.forEach(function (item, i) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.className = 'entry';
      btn.setAttribute('data-index', String(i));

      var head = document.createElement('div');
      head.className = 'head';
      setText(head, (item.id || ('#' + (i + 1))) + (item.title ? ' · ' + item.title : ''));
      btn.appendChild(head);

      if (item.description) {
        var p = document.createElement('p');
        p.className = 'desc';
        setText(p, item.description);
        btn.appendChild(p);
      }
      var changed = listBlock('What changed', item.changes);
      if (changed) btn.appendChild(changed);
      var gaps = listBlock('Still to fix', item.gaps);
      if (gaps) btn.appendChild(gaps);

      btn.onclick = function () { go(i); };
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  function show(i) {
    var n = state.items.length;
    state.index = ((i % n) + n) % n;
    var frames = el('frames').children;
    for (var k = 0; k < frames.length; k++) {
      frames[k].classList.toggle('on', k === state.index);
    }
    var dots = el('dots').children;
    for (var d = 0; d < dots.length; d++) {
      dots[d].classList.toggle('on', d === state.index);
    }
    var entries = el('log').querySelectorAll('.entry');
    for (var e = 0; e < entries.length; e++) {
      entries[e].classList.toggle('on', e === state.index);
    }
    var item = state.items[state.index];
    setText(el('cap-title'), (item.id || '') + (item.title ? ' · ' + item.title : ''));
    setText(el('cap-count'), (state.index + 1) + ' of ' + n);

    // Keep the active log entry visible inside the panel only (not the page)
    var active = entries[state.index];
    var log = el('log').parentNode;
    if (active && log) {
      var top = active.parentNode.offsetTop + active.offsetTop - 8;
      log.scrollTo({ top: top, behavior: 'smooth' });
    }
  }

  function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
  function restartTimer() {
    stopTimer();
    if (state.playing) {
      state.timer = setInterval(function () { show(state.index + 1); }, INTERVAL_MS);
    }
  }

  // ----- Scene drop-down and open -----

  function sceneUrl(id) { return location.pathname + '?set=' + encodeURIComponent(id); }

  function buildPicker() {
    var sel = el('picker');
    sel.replaceChildren();
    if (!sets.length) { sel.hidden = true; return; }
    sets.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s.id;
      setText(o, s.label || s.id);
      if (current && s.id === current.id) o.selected = true;
      sel.appendChild(o);
    });
    sel.hidden = false;
    sel.onchange = function () { location.href = sceneUrl(sel.value); };
  }

  function openSet(set) {
    current = set;
    el('delete-scene').disabled = false;
    buildPicker();
    ViewerDB.loadScenes(set).then(function (items) {
      start(set.title, set.subtitle, items);
    }).catch(function (err) {
      setText(el('subtitle'), 'The scenes could not be loaded. ' + err.message);
    });
  }

  // ----- Delete (reject) -----

  function isMuted() {
    try { return Date.now() < Number(localStorage.getItem(MUTE_KEY) || 0); } catch (e) { return false; }
  }
  function muteWarning() {
    try { localStorage.setItem(MUTE_KEY, String(Date.now() + MUTE_MS)); } catch (e) { /* no storage: the warning shows again */ }
  }

  function openDeleteDialog() {
    var dlg = el('delete-dialog');
    setText(el('delete-text'), '"' + current.title + '" will be flagged as rejected in the ' + current.db.name +
      ' database and hidden from this viewer. Its scenes stay in the database.');
    el('delete-mute').checked = false;
    if (typeof dlg.showModal !== 'function') {
      if (window.confirm('Flag "' + current.title + '" as rejected and hide it? The scenes stay in the database.')) rejectCurrent();
      return;
    }
    dlg.showModal();
  }

  function rejectCurrent() {
    var set = current;
    var btn = el('delete-scene');
    btn.disabled = true;
    showNotice('Flagging "' + set.title + '" as rejected…');
    ViewerDB.reject(set).then(function () {
      var rest = sets.filter(function (s) { return s.id !== set.id; });
      if (!rest.length) {
        el('frames').replaceChildren();
        el('log').replaceChildren();
        el('dots').replaceChildren();
        setText(el('title'), 'No scenes left');
        setText(el('subtitle'), '');
        setText(el('cap-title'), '');
        setText(el('cap-count'), '');
        showNotice('"' + set.title + '" is flagged as rejected in the ' + set.db.name + ' database. No scenes are left to show.');
        return;
      }
      try { sessionStorage.setItem(NOTICE_KEY, '"' + set.title + '" is flagged as rejected in the ' + set.db.name + ' database.'); } catch (e) { /* the note is skipped */ }
      location.href = sceneUrl(rest[0].id);
    }, function (err) {
      btn.disabled = false;
      showNotice('Not rejected. The database said no: ' + err.message + '. The scene is still shown.');
    });
  }

  el('delete-scene').onclick = function () {
    if (!current) return;
    if (isMuted()) { rejectCurrent(); return; }   // warning muted for 2 minutes
    openDeleteDialog();
  };
  el('delete-cancel').onclick = function () { el('delete-dialog').close(); };
  el('delete-confirm').onclick = function () {
    if (el('delete-mute').checked) muteWarning();
    el('delete-dialog').close();
    rejectCurrent();
  };

  // ----- Start -----

  // A note from the last delete, shown once after the page reloads on the next scene.
  try {
    var note = sessionStorage.getItem(NOTICE_KEY);
    if (note) { sessionStorage.removeItem(NOTICE_KEY); showNotice(note); }
  } catch (e) { /* no storage: no note */ }

  ViewerDB.loadSets().then(function (res) {
    sets = res.sets;
    if (res.errors.length) setText(el('subtitle'), 'Could not read a database: ' + res.errors.join('; '));
    if (!sets.length) {
      if (!res.errors.length) setText(el('subtitle'), 'No reviews to show.');
      el('delete-scene').disabled = true;
      buildPicker();
      return;
    }
    var pick = sets.filter(function (s) { return s.id === requestedSet; })[0] || sets[0];
    if (pick.id !== requestedSet) {
      // Unknown or rejected link: go to the first review that is shown.
      location.replace(sceneUrl(pick.id) + (stepParam >= 1 ? '&step=' + stepParam : ''));
      return;
    }
    openSet(pick);
  }).catch(function (err) {
    setText(el('subtitle'), 'The reviews could not be loaded. ' + err.message);
  });
})();
</script>
</body>
</html>
